<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Сплошной брендовый фон без прозрачности (требование VK) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Декоративные фоновые круги -->
  <circle cx="430" cy="80" r="160" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="60" cy="460" r="140" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- Основная карточка-органайзер с мягкой тенью -->
  <g filter="url(#shadow)">
    <!-- Белый планшет/лист -->
    <rect x="96" y="86" width="320" height="340" rx="36" fill="url(#sheetGrad)"/>
    
    <!-- Шапка листа: стилизованный конёк дома/папки -->
    <path d="M96 140 C96 110, 110 86, 140 86 L372 86 C402 86, 416 110, 416 140 L416 146 L96 146 Z" fill="#E2E8F0"/>
    
    <!-- Верхний клипс/зажим органайзера -->
    <rect x="206" y="68" width="100" height="36" rx="14" fill="#3B82F6"/>
    <rect x="236" y="80" width="40" height="12" rx="6" fill="#FFFFFF"/>

    <!-- Строка 1: Горизонтальный чек-бокс с галочкой -->
    <g transform="translate(140, 178)">
      <circle cx="20" cy="20" r="20" fill="url(#accentGrad)"/>
      <path d="M11 20 L17 26 L29 14" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="10" width="160" height="18" rx="9" fill="#1E293B"/>
    </g>

    <!-- Строка 2: Прогресс/платежи -->
    <g transform="translate(140, 246)">
      <circle cx="20" cy="20" r="20" fill="#3B82F6"/>
      <!-- Символ рубля/финансов -->
      <path d="M15 11 L23 11 C26.3 11 28 13 28 16 C28 19 26.3 21 23 21 L15 21 L15 29 M12 21 L24 21 M12 25 L21 25" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="10" width="130" height="18" rx="9" fill="#64748B"/>
    </g>

    <!-- Строка 3: Документы/счётчики -->
    <g transform="translate(140, 314)">
      <circle cx="20" cy="20" r="20" fill="#F59E0B"/>
      <!-- Символ молнии/счётчика -->
      <path d="M21 10 L14 21 L20 21 L18 30 L27 18 L21 18 Z" fill="#FFFFFF"/>
      <rect x="56" y="10" width="100" height="18" rx="9" fill="#94A3B8"/>
    </g>
  </g>
</svg>