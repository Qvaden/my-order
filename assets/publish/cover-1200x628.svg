<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329"/>
      <stop offset="45%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Сплошной фон обложки -->
  <rect width="1200" height="628" fill="url(#coverBg)"/>

  <!-- Фоновые световые блики -->
  <circle cx="1050" cy="120" r="320" fill="#3B82F6" fill-opacity="0.25" filter="blur(60px)"/>
  <circle cx="1180" cy="520" r="280" fill="#7C3AED" fill-opacity="0.2" filter="blur(50px)"/>

  <!-- ЛЕВАЯ КОЛОНКА: ТЕКСТ И ПРЕИМУЩЕСТВА -->
  <g transform="translate(80, 84)">
    <!-- Бейдж категории -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="110" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93C5FD" text-anchor="middle" letter-spacing="1">VK MINI APPS · 0+</text>

    <!-- Главный заголовок -->
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">МОЙ ПОРЯДОК</text>

    <!-- Подзаголовок -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#BFDBFE">Бытовые дела, платежи и документы</text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#BFDBFE">в одном удобном приложении</text>

    <!-- Список преимуществ -->
    <g transform="translate(0, 230)">
      <!-- Пункт 1 -->
      <circle cx="16" cy="16" r="14" fill="#10B981"/>
      <path d="M10 16 L14 20 L22 12" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF">Базовый функционал полностью бесплатен</text>

      <!-- Пункт 2 -->
      <circle cx="16" cy="56" r="14" fill="#3B82F6"/>
      <path d="M12 56 L15 60 L21 52" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="42" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF">Работает офлайн без интернета (IndexedDB)</text>

      <!-- Пункт 3 -->
      <circle cx="16" cy="96" r="14" fill="#8B5CF6"/>
      <path d="M12 96 L15 100 L21 92" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="42" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF">Семейный доступ, квитанции в PDF и прогноз</text>
    </g>

    <!-- Кнопка/Плашка "Открыть в каталоге" -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="240" height="52" rx="26" fill="#FFFFFF"/>
      <text x="120" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#1D4ED8" text-anchor="middle">Открыть сервис ➔</text>
    </g>
  </g>

  <!-- ПРАВАЯ КОЛОНКА: ИНТЕРФЕЙСНЫЙ КОЛЛАЖ КАРТОЧЕК -->
  <g transform="translate(680, 60)">
    <!-- Задняя карточка (Тёмная тема / Аналитика PRO) -->
    <g transform="translate(100, 30) rotate(5)" filter="url(#cardShadow)">
      <rect width="320" height="460" rx="28" fill="url(#cardGradDark)" stroke="#334155" stroke-width="1.5"/>
      <!-- Заголовок карточки -->
      <rect x="24" y="24" width="130" height="14" rx="7" fill="#8B5CF6"/>
      <rect x="24" y="52" width="180" height="26" rx="8" fill="#F8FAFC" fill-opacity="0.9"/>
      <!-- Круговой индикатор/график -->
      <circle cx="160" cy="180" r="70" fill="none" stroke="#334155" stroke-width="20"/>
      <circle cx="160" cy="180" r="70" fill="none" stroke="#8B5CF6" stroke-width="20" stroke-dasharray="280 440" stroke-linecap="round"/>
      <circle cx="160" cy="180" r="70" fill="none" stroke="#10B981" stroke-width="20" stroke-dasharray="100 440" stroke-dashoffset="-290" stroke-linecap="round"/>
      <!-- Строки расходов -->
      <rect x="30" y="280" width="180" height="14" rx="7" fill="#64748B"/>
      <rect x="230" y="280" width="60" height="14" rx="7" fill="#8B5CF6"/>
      <rect x="30" y="310" width="140" height="14" rx="7" fill="#64748B"/>
      <rect x="230" y="310" width="60" height="14" rx="7" fill="#10B981"/>
      <rect x="30" y="340" width="160" height="14" rx="7" fill="#64748B"/>
      <rect x="230" y="340" width="60" height="14" rx="7" fill="#F59E0B"/>
      <!-- PRO бейдж -->
      <rect x="24" y="390" width="272" height="42" rx="16" fill="#7C3AED" fill-opacity="0.25"/>
      <text x="160" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#C4B5FD" text-anchor="middle">👑 Прогноз расходов на ноябрь</text>
    </g>

    <!-- Передняя карточка (Светлая тема / Платежи и дела) -->
    <g transform="translate(0, 50) rotate(-4)" filter="url(#cardShadow)">
      <rect width="320" height="460" rx="28" fill="url(#cardGrad1)" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Шапка карточки -->
      <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Ноябрь 2026</text>
      <rect x="200" y="28" width="96" height="26" rx="13" fill="#EFF6FF"/>
      <text x="248" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">В ПОРЯДКЕ</text>

      <!-- Виджет сводки -->
      <rect x="24" y="70" width="272" height="74" rx="18" fill="#F1F5F9"/>
      <text x="40" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B">К оплате в этом месяце</text>
      <text x="40" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#1E293B">6 680 ₽</text>

      <!-- Элемент 1: Квартплата ЖКХ -->
      <rect x="24" y="160" width="272" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="50" cy="193" r="16" fill="#DBEAFE"/>
      <text x="50" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">🏠</text>
      <text x="76" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Квартплата ЖКХ</text>
      <text x="76" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">до 20 ноября · Ежемесячно</text>
      <text x="276" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end">4 850 ₽</text>

      <!-- Элемент 2: Интернет -->
      <g transform="translate(0, 76)">
        <rect x="24" y="160" width="272" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="50" cy="193" r="16" fill="#D1FAE5"/>
        <text x="50" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">🌐</text>
        <text x="76" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Домашний интернет</text>
        <text x="76" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10B981">Оплачено ✓</text>
        <text x="276" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#64748B" text-anchor="end">750 ₽</text>
      </g>

      <!-- Элемент 3: Счётчик воды -->
      <g transform="translate(0, 152)">
        <rect x="24" y="160" width="272" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="50" cy="193" r="16" fill="#FEF3C7"/>
        <text x="50" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">💧</text>
        <text x="76" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Показания счётчиков</text>
        <text x="76" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F59E0B">Осталось 4 дня</text>
        <text x="276" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#2563EB" text-anchor="end">Внести ➔</text>
      </g>

      <!-- Быстрый статус -->
      <rect x="24" y="390" width="272" height="44" rx="16" fill="#2563EB"/>
      <text x="160" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Добавить платеж или дело</text>
    </g>
  </g>
</svg>