<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="МОЙ ПОРЯДОК — учёт платежей, счётчиков, документов и задач">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="app-manifest.webmanifest">
  <title>Мой Порядок</title>

  <!--
    Этап 10: тема ставится ДО первой отрисовки. Без этого блока приложение
    в тёмном клиенте VK показывало бы белую вспышку (CSS грузится раньше JS).
    Источник темы — launch-параметр vk_color_scheme (его присылают все клиенты
    VK). Вне ВКонтакте тема остаётся светлой: по критериям этапа браузерная
    версия должна работать «как раньше». Модуль js/vk-integration.js позже
    уточнит тему событиями VK Bridge.
  -->
  <script>
    (function () {
      var theme = null;
      try {
        var userTheme = localStorage.getItem('myorder_user_theme');
        if (userTheme === 'dark' || userTheme === 'light') {
          theme = userTheme;
        } else {
          var q = window.location.search;
          var manual = /[?&]theme=([^&]+)/.exec(q);
          if (manual) {
            theme = decodeURIComponent(manual[1]).toLowerCase() === 'dark' ? 'dark' : 'light';
          } else {
            var m = /[?&]vk_color_scheme=([^&]+)/.exec(q);
            if (m) { theme = /dark/i.test(decodeURIComponent(m[1])) ? 'dark' : 'light'; }
          }
        }
      } catch (e) { /* разбираем аккуратно */ }
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = 'dark';
      }
      try {
        var a = localStorage.getItem('myorder_accent');
        if (a && a !== 'blue') { document.documentElement.setAttribute('data-accent', a); }
        var c = localStorage.getItem('myorder_contrast');
        if (c === 'high') { document.documentElement.setAttribute('data-contrast', 'high'); }
        var fs = localStorage.getItem('myorder_font_size');
        if (fs) {
          var px = fs === 'large' ? '18px' : (fs === 'xlarge' ? '20px' : '16px');
          document.documentElement.style.setProperty('--base-font-size', px);
          document.documentElement.setAttribute('data-font-size', fs);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css?v=17">

  <!--
    Этап 10: VK Bridge SDK.
    Локальная копия (js/vendor) используется как основной источник — она
    переживает офлайн и не зависит от CDN. Если локальный файл не загрузился,
    срабатывает подхват с unpkg. Вне ВКонтакте SDK просто не делает ничего
    (window.vkBridge.isWebView() === false), приложение работает как сайт.
  -->
  <script src="js/vendor/vk-bridge.min.js"></script>
  <script>
    // Fallback: если локальной копии нет — тянем с CDN. Синхронно, до app.js.
    if (typeof window.vkBridge === 'undefined') {
      document.write('<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"><\/script>');
    }
  </script>
</head>
